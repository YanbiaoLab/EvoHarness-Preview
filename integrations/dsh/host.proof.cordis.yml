# The proof tools, as a PATCH onto whatever configuration your dsh already runs.
#
# Not a deployment. `demo.cordis.yml` beside this one says the same thing and
# says why: patch files resolve modules from the selected dsh profile rather
# than from this directory, so a launcher has to render these portable relative
# source paths to checkout-local absolute paths before boot. Do not pass this
# source file to `--patch` directly -- use `scripts/dsh_proof.sh`.
#
# This is the HOST side: a person and an agent working on a proof together. It
# must never be merged into a CANDIDATE's config. A candidate holding
# `proof_attack` could spend the run's budget on goals nobody asked for, and
# one holding `proof_sketch` would be inside the loop that is supposed to be
# judging it.
#
# No llm row: the session's model is whatever your dsh profile already
# configures. This patch adds tools and nothing else.
#
# Required in the launching environment:
#
#   EVO_PYTHON         interpreter EvoHarness is installed in
#   EVO_HARNESS_ROOT   the EvoHarness checkout
#   EVO_PROOF_WORK     workspace holding graph.db and every run directory
#   EVO_LEAN_PROJECT   lake project providing Mathlib (omit for core-Lean goals)
#
# And, for `proof_attack` only:
#
#   EVOHARNESS_API_BASE / EVOHARNESS_API_KEY

- insert:
    - id: evo-proof
      name: '../src/proof.ts'
