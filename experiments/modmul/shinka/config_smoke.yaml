# Generated from config.yaml for the MODMUL_QUICK end-to-end smoke test.
# Three generations on 20-second training runs: this checks the plumbing
# (patch applied, score parsed, metrics reach the next prompt), NOT quality.
max_evaluation_jobs: 2
max_proposal_jobs: 2
max_db_workers: 2
job_time: 00:30:00
activate_script: null
python_executable: null
llm_endpoint:
  api_base_env: EVOHARNESS_API_BASE
  api_key_env: EVOHARNESS_API_KEY
  models:
  - glm-5.2
db_config:
  num_islands: 2
  archive_size: 40
  elite_selection_ratio: 0.3
  num_archive_inspirations: 1
  num_top_k_inspirations: 1
  migration_interval: 10
  migration_rate: 0.1
  island_elitism: true
  enforce_island_separation: true
  parent_selection_strategy: weighted
  parent_selection_lambda: 10
  archive_selection_strategy: crowding
  island_selection_strategy: equal
  archive_criteria:
    combined_score: 1.0
    loc: 0.0
  enable_dynamic_islands: false
  stagnation_threshold: 10
evo_config:
  patch_types:
  - diff
  - full
  - cross
  patch_type_probs:
  - 0.7
  - 0.2
  - 0.1
  num_generations: 3
  max_patch_resamples: 3
  max_patch_attempts: 1
  job_type: local
  language: python
  llm_kwargs:
    temperatures:
    - 0
    - 0.5
    - 1.0
    reasoning_efforts:
    - low
    - medium
    - high
    max_tokens: 32768
  llm_dynamic_selection: ucb1
  llm_dynamic_selection_kwargs:
    exploration_coef: 1.0
    cost_aware_coef: 0.5
  embedding_model: null
  code_embed_sim_threshold: 0.99
  max_novelty_attempts: 1
  meta_rec_interval: null
  init_program_path: initial.py
  results_dir: results/modmul_shinka_smoke
  max_api_costs: null
  evolve_prompts: false
