# modmul Round-12 主跑(L40S 46GB)。
#
# 相对 l40s_r1.yaml 改了三处,每处都有 2026-07-27 当天的实测出处:
#
#   llm_models          MiniMax-M3 -> gpt-5.6-terra(换 provider)
#   proposal_concurrency         4 -> 16(新 provider 的曲线是平的)
#   seed                        21 -> 22(r7 的 RNG 序列已经用过)
#
# 其余保持 r1 的数字。别在没有曲线的地方往上加 —— 这条规则在 r7 上又验证了
# 一次:MiniMax-M3 的 4 路是拐点,后来 provider 整体不回包,r7 死在
# "The read operation timed out" 上,一代都没跑完。

search:
  num_generations: 200                # 上限不是目标;checkpoint 每代落盘,
                                      # 判据 30-40 代可读
                                      # (todo/modmul_evolution_validation.md)
  eval_batch_size: 16                 # GPU 并发扩展曲线(2026-07-26,QUICK 档,
                                      # 同 seed,测同样墙钟里实际走的训练步数):
                                      #   1 路 7602 步 100%  有效吞吐 1.0x
                                      #   8 路 6590 步  87%          6.9x
                                      #  16 路 5920 步  78%         12.5x
                                      #                GPU 12-14% / 612 MiB
                                      #  48 路 机器负载 49,ssh 被挤断
                                      # 瓶颈是每进程 CPU/Python 开销不是 GPU
                                      # (cell 只有 91,841 参数)

  proposal_concurrency: 16            # 新 provider 实测(2026-07-27,
                                      # ~12k token 提示词,真实种子基因组):
                                      #   1 路 41s   0/1 失败   41s/提案
                                      #   4 路 42s   0/4        11s/提案
                                      #   8 路 42s   0/8         5s/提案
                                      #  16 路 42s   0/16        3s/提案
                                      # 曲线到 16 完全平,没测出拐点。取 16 是
                                      # 因为它等于 eval_batch_size —— 一代的
                                      # 提案在 42 秒内一次性发完,提案不再是
                                      # 瓶颈。16 以上没数据,所以没往上加。
                                      #
                                      # 对照 MiniMax-M3:1 路 203s、4 路是拐点、
                                      # 8 路 7/8 超时。换 provider 买到的是
                                      # 单次 5 倍、批次 68 倍。

  llm_models: ["gpt-5.6-terra"]       # 2026-07-27 第二次换 provider。
                                      # MiniMax-M3 在 r7 期间整体停止回包
                                      # (每个提案 3 次重试全部 read timeout)。
                                      # 注:该端点走 Cloudflare,必须发
                                      # User-Agent,否则 403(见 bba0bc2)

  llm_max_tokens: 40960               # 多文件基因组,整文件重写需要。
                                      # 实测回复 1767-2141 tokens,离上限很远;
                                      # 留着是给"一次改多个文件"的重写用的
  seed: 26
  operator_probs: [0.45, 0.45, 0.1]   # revise / rewrite / recombine
  repair_probability: 0.4
  max_consecutive_infra_failures: 5   # 同时是提案器熔断阈值(87d80f7)

population:
  num_islands: 3                      # 0=limb_horner 1=horner_cell 2=serial_ar
  migration_interval: 10
  migration_rate: 0.1
  archive_size: 60

# 每代墙钟由评测决定,不由提案决定:训练预算是墙钟秒数,一代 ≈ 最慢候选
# ≈ 走满 R2 的 90 分钟。提案现在只占 42 秒,可以忽略。
#
# 两条快通道让相当一部分候选远低于 90 分钟:
#   * 只改 model.py 的变异 -> 完全跳过训练,实测 406 秒
#   * 改 arch.py 的变异 -> 不冷启动,实测保留 98.6% 参数,只重学 embed.0.weight
#
# 所以每代实际在 8-95 分钟之间。跑起来后按前 5 代实测重新外推,
# 别拿这段注释当预算。
#
# r7 的教训不在参数上,在两个已修的缺陷上(58fff7c):岛轮转此前按代而不是
# 按提案,导致一代 16 个提案全落同一个岛;children_count 此前在子代入库时
# 才加,而整批是先规划后入库的,于是 1/(1+children_count) 这个唯一的
# 反集中因子在批内恒等于 1。r7 因此 15 个后代全部出自同一个亲本。
# r8 的日志会逐条打印 (岛, 亲本, children_count, 算子),可以直接核对而不是事后猜。

# ---------------------------------------------------------------------------
# r8 -> r9 的三处变化(配置文件本身只改了 seed,其余在代码里):
#
#   1. R2 档评测口径改成官方的 100 题/层 x 11 层 = 1100 题,预算 300.0 秒。
#      r8 用的是 50 题/层 + 141.8 秒 —— 题数等比缩放了,但**批数没有**,
#      而官方计时器是在批边界检查的。现在 h90 就是官方的 h90。
#
#   2. fitness 加入连续的墙钟项(权重 0.15,是跨阈值奖励的一半,并按
#      overall 精度缩放)。r8 里 8ab3347e 比亲本慢 38%、分数一字不差,
#      选择器看到的是两个等价候选 —— 而墙钟正是 tier 10 唯一的门。
#
#   3. limb_horner 种子的 TOTAL_STEPS 2_000_000 -> 3_000_000,来自 r8 的
#      06dde31b(它读 training_skipped 诊断推断出撞的是步数上限)。
#      tier 9 从 80% 到 98%,墙钟不变。其权重经 _pretrained 缓存带入,
#      不重训。
#
# 因此 r9 的分数与 r8 **不可比**;第 0 代的三个种子就是新口径下的基线。

# ---------------------------------------------------------------------------
# r9 -> r10(配置只改 seed,其余在代码里):
#
#   1. MAX_WIDTH 4096 -> 2048。诊断层不计分却第一个跑、占同一 300 秒时钟,
#      而它 78% 的开销是十道 p 宽 4096 位的题 —— 计分层最宽只到 2048。
#      诊断层 281 秒 -> 61 秒,第九层与第十层因此第一次进得了预算。
#      代价说清楚:那十道题模型是**做对的**(10/10),放弃的是十个不计分的
#      正确答案,换的是排行榜键的两级。这属于提交时要写进模型描述的取舍。
#
#   2. fitness 加"被饿死的层按时钟接近度给分"(权重 0.15)。r9 的教训:
#      诊断层吃光预算时整条谱系恒等于 0,搜索在死平原上随机游走,
#      最后走向"抛弃 32 万步训练、只做前两层"。现在那片平原有坡度了。
#      诚实标注:它救不了 r9 那次(种子 0.0418 对冷启动 0.1043),
#      平原的成因是在模型里修掉的,不是靠评分。
#
#   3. 时钟现在含诊断层。此前所有墙钟判断读的都是一个缺了最大项的时钟。
#
#   4. 权重继承会沿祖先链向上找。r9 第三代一次 repair 冷启动就丢掉了
#      32 万步,因为它的亲本评测失败、什么都没发布。
#
# 第 0 代三个种子 = 新口径下的基线。预期 limb_horner 首次拿到 h90=10。

# ---------------------------------------------------------------------------
# r10 -> r11(配置只改 seed,其余在代码与提示词里):
#
#   1. **架构改动有恢复期。** r10 里十三个动了 arch.py 的候选全部死在第一道
#      晋级闸,包括四个找到 RADIX_BITS 的和三个找到 ROUNDS 的 —— 而它们是
#      在没人提示的情况下自己找到这两个杠杆的。实测 2f46bb2f(一行,
#      ROUNDS 3→1,权重完整继承):
#          480s  t2=53% t3=10%   ← 被闸杀死的地方
#         1080s  t2=50% t3=13%
#         1680s  t2=67% t3=30%   ← 两个条件同时过
#      不是变异坏,是没训完。现在这类候选在第一道闸前拿两档预算(1800 秒)。
#
#   2. 计时段独占 GPU。此前 16 个候选同时评测,墙钟被高估约 2 倍,而 fitness
#      现在给墙钟定价 —— 等于在选噪声。
#
#   3. sys_msg v5:补了"每个文件的变异要付什么评测代价",并纠正两处过期说法
#      (改 arch.py 不是冷启动;warm_start 的 partial 讲的是文件不是损失)。
#
# 基线(r10 实测,干净计时):h90=9 / overall 0.899 / 时钟 385.2s。
# 距 h90=10 差 85 秒。ROUNDS 3→1 推算能把时钟压到约 185 秒。

# ---------------------------------------------------------------------------
# r11 -> r12(配置只改 seed):
#
#   唯一实质改动是种子的 train.py:**优化器状态形状守卫**。
#
#   RADIX_BITS 会重塑 embed 的第一个矩阵(in_features 从 7 变到 16),而 Adam
#   的 exp_avg / exp_avg_sq 按参数位置存、带着旧形状。load_state_dict 不做
#   检查,所以加载时不报错,第一次 opt.step() 才在 _multi_tensor_adam 里炸:
#       RuntimeError: The size of tensor a (7) must match tensor b (16)
#   包在外面的 except: pass 挡不住 —— 那里根本没有异常抛出。
#
#   limb_horner 本来有防护,但写成了 `opt_path = Path(str(opt_path)+".stale")`
#   —— 只改本地变量,磁盘上的旧文件没动。于是第一档跳过它、把新状态存到别的
#   名字;第二档时权重形状已一致、防护不再触发,加载了那个从没被删掉的旧文件。
#   另外两个种子连防护都没有。
#
#   **这个 bug 从 r7 起就在杀 RADIX_BITS,横跨三轮。** r11 里九个动了它的候选,
#   九个都死在 R1 的同一行。三次"搜索找到了杠杆但它就是不 work",根因是一行
#   没落到磁盘上的重命名。
#
# r11 十小时六代的成绩:最好后代 0.8510,种子 0.8521 —— 没有一个超过起点。
# 但方向对:9 个候选找到 RADIX_BITS,1 个独立发现了诊断层吃预算(1793c818,
# 173 秒 / h90=8,比种子快 2.2 倍)。
#
# 晋级历史(lineage/promotion/)整个带过来,跳过两代引导期。
# 档位形状未变,记录里的候选都是没崩溃的那些,分布未被 bug 污染。
