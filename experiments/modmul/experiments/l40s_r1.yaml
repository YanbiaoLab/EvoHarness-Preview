# modmul Round-1 主跑(L40S 46GB)。参数全部来自 2026-07-26/27 的实测,
# 不是经验值 —— 每个数字下面写了它的出处。
#
# 与 gpu_run3.yaml 的差异只有一处是"调大",其余是同一批测量的连带后果:
# eval_batch_size 3 -> 16。
#
# 并发扩展曲线(QUICK 档,同一 seed,测的是同样墙钟预算下实际走的训练步数):
#
#   并发    平均步数   相对单进程   有效吞吐   GPU 利用率 / 显存
#     1      7602        100%        1.0x
#     8      6590         87%        6.9x
#    16      5920         78%       12.5x      12-14% / 612 MiB(46 GB 里)
#    48      —— 机器负载冲到 49,ssh 被挤断
#
# 瓶颈不是 GPU:16 路时利用率只有 12-14%、显存不到 2%。cell 只有 91,841 参数,
# 发的是大量小 kernel,受限于每个进程的 CPU/Python 开销(128 核)。
#
# 取 16 的理由:有效吞吐 12.5 倍,代价是每个候选少 22% 训练。而权重继承让
# 训练量沿谱系累积,所以少掉的 22% 是每一"代"的增量而不是总量;换来的
# 广度(每岛每代 5 个候选而不是 1 个)是选择压力能否存在的前提。
# 32/48 没测出可用数据,48 直接把机器压垮了 —— 别在没有曲线的地方往上加。

search:
  num_generations: 200                # 上限,不是目标。checkpoint 每代落盘,
                                      # 判据在 30-40 代就能读(见
                                      # todo/modmul_evolution_validation.md)
  eval_batch_size: 16                 # ← 依据见上表
  proposal_concurrency: 4             # 提案是串行网络等待:16 次 x 105 秒 = 28 分钟,
                                      # 在快通道命中时占一代的 82%。只重叠网络等待,
                                      # 规划仍单线程按 rng 顺序
  llm_models: ["MiniMax-M3"]          # 2026-07-27 换 provider(原 qwen key 过期)
  llm_max_tokens: 40960               # 多文件基因组,整文件重写需要
  seed: 21
  operator_probs: [0.45, 0.45, 0.1]   # revise / rewrite / recombine
  repair_probability: 0.4
  max_consecutive_infra_failures: 5   # 同时是提案器熔断的阈值(87d80f7)

population:
  num_islands: 3                      # 0=limb_horner 1=horner_cell 2=serial_ar
  migration_interval: 10
  migration_rate: 0.1
  archive_size: 60

# 每代墙钟:训练预算是墙钟秒数,所以一代 ≈ 最慢候选 ≈ R2 走满的 90 分钟,
# 与 eval_batch_size 无关 —— 调大并发买的是"同样 90 分钟里多少个候选",
# 不是"每代更快"。
#
# 但两条快通道会让相当一部分候选远低于 90 分钟:
#   * 只改 model.py 的变异 → 训练完全跳过,实测 406 秒(基线同样内容付 5117 秒)
#   * 改 arch.py 的变异 → 不再冷启动,实测保留 98.6% 的参数,只重学 embed.0.weight
#
# 所以每代实际在 8-95 分钟之间,取决于这一批 16 个候选里有几个动了
# arch.py / train.py。跑起来后按前 5 代实测重新外推,别拿这段注释当预算。
