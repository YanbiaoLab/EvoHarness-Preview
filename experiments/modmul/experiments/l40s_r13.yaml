# modmul Round-13 主跑(L40S 46GB)。
#
# 参数与 r12 完全一致,只有 seed 26 -> 27。实质改动全在代码与种子里,
# 一次带上五件事 —— 每一件都有当天的实测或组织者原话出处。

search:
  num_generations: 200
  eval_batch_size: 16
  proposal_concurrency: 16
  llm_models: ["gpt-5.6-terra"]
  llm_max_tokens: 40960
  seed: 27
  operator_probs: [0.45, 0.45, 0.1]
  repair_probability: 0.4
  max_consecutive_infra_failures: 5

population:
  num_islands: 3
  migration_interval: 10
  migration_rate: 0.1
  archive_size: 60

# ---------------------------------------------------------------------------
# r12 -> r13 的五处变化(配置只改 seed,其余在代码、种子与提示词里):
#
#   1. **model.py 两遍 pass 重构(合规 + 提速)。** 组织者 2026-07 裁决:
#      合规编码器不得接收模型反馈,且模型必须吃原始 (a,b,p)。原三遍方案的
#      第三遍把网络输出的位切片当 digit 流喂回,落在裁决的灰区。改成:
#      pass1 流 a 的原始 digit(乘数寄存器=1)得 a mod p;pass2 流 b 的
#      原始 digit、寄存器放 pass1 残差,Horner 直接累出 (a mod p)*b mod p。
#      同一训练分布,权重一字不动。实测 55/55 与三遍基线全等。
#      每题省一个寄存器宽度的步数(tier 10 约 -20%)。
#
#   2. **train.py Δ 分层(解锁批处理的钥匙)。** 社区实测(mod-arith-k2 fork):
#      只在 Δ=0(素数填满寄存器)训练的 cell,在 Δ∈{1,2} 塌到 2-30%,
#      Δ≥4 安全、16..64 误差集全等 —— 鲁棒性跟着训练分布走,不跟着结构走。
#      r12 第 1 代四个候选各自独立发明了"填充到 2 的幂再合批",四个全零,
#      正是这个坑。现在 DELTA_SHARE=0.5 的样本素数比寄存器窄 4-67 位。
#      在本机 cell 上复现了陷阱本身:现权重 + 填充分组 = 全零,55/55 变 0。
#
#   3. **model.py 分桶批处理。** 素数位长向上取整到 64 的倍数、保证 Δ≥4,
#      永不落进 {1,2,3}。精确位长分组把一层 100 题拆成约 100 个近单题批,
#      tier 9 的 234.9 秒大头是串行发射;分桶后一层塌成几个大批。
#      依赖第 2 条的重训 —— 起跑前先做 Δ 适应训练并验证,不达标就摘掉
#      这一条单独跑(搜索已经证明它自己会重新发明分桶)。
#
#   4. **计时段冻结训练(SIGSTOP/SIGCONT)。** 判决性实测:同一份种子权重
#      同样 100 题,空卡 121.2 秒,九个训练进程在跑时 175.5 秒(1.45x)。
#      折进 fitness 时间项约 0.027,而 r11 种子与最好后代差 0.0011 ——
#      每个孩子都在忙卡上计时、再跟空卡上计时的种子比,"没人赢过种子"
#      很可能整个是测量偏差。现在 timed 锁持有期间所有 train_runner 冻结,
#      种子 train.py 检测 >5 秒的间隙并顺延 deadline,冻结不记账。
#      新训练起跑前先碰一次锁,堵上"冻结期间新进程落卡"的缝。
#
#   5. **两处评分信号修正。** budget_headroom 在最高档改用实测时钟
#      (探针 3 题摊 CUDA 初始化,报过 19x,真值 1.57x;探针值保留为
#      budget_headroom_probe,另加 tier1 一题暖场);扰动闸探针只取
#      tier>=3(tier1 模数只有 2/3/5/7,随机权重蒙中 1/3 是天花板效应,
#      r11/r12 的 horner_cell 种子都被这样误杀)。
#
# 权重缓存迁移:arch.py 未变,按 arch.sha256 匹配旧 digest -> 新 digest,
# limb_horner 一支用 Δ 适应后的权重(而不是 r12 原权重)入缓存。
# 晋级历史(lineage/promotion/)继续带,但注意第 4 条改变了计时口径:
# 时间不进晋级分(晋级只看精度),历史仍可比。
#
# 基线预期:两遍重构 + 分桶 + 冻结计时下,种子的官方口径时钟应从 470 秒
# 显著下降;若 k=2(r12 第 1 代的四个 RADIX_BITS=2 候选)站住,以其权重
# 起第 4 个岛或直接替换 limb_horner 种子。h90=10 需要总钟 <= 300 秒。
