# modmul Round-14 主跑(L40S 46GB)。r13 号从未起跑 —— 它准备期间经验层的
# 四个缺口被定位并修掉,两拨改动合并成 r14 一次上。
#
# 与 r12 的差异 = l40s_r13.yaml 记录的五条(两遍 pass / Δ 分层 / 分桶批处理 /
# 计时冻结 / 评分信号修正)+ 下面的经验层三条。recipe 从 e3r 换成 e5s(全栈)。

search:
  num_generations: 200
  eval_batch_size: 16
  proposal_concurrency: 16
  llm_models: ["gpt-5.6-terra"]
  llm_max_tokens: 40960
  seed: 28
  operator_probs: [0.45, 0.45, 0.1]
  repair_probability: 0.4
  max_consecutive_infra_failures: 5

population:
  num_islands: 3
  migration_interval: 10
  migration_rate: 0.1
  archive_size: 60

# ---------------------------------------------------------------------------
# r12 -> r14 的经验层改动(缺口验尸见 2026-07-29 会话;代码在 evoplus 与
# recipes,每条都有 r12 的尸体作证):
#
#   1. **证据签名(缺口三)。** evaluated 条目此前只带 Δfitness 和 diff 摘要:
#      四个 k=2 候选的死亡渲染成 "did NOT help (Δfitness -0.78): arch.py
#      +1/-1" —— 说了什么死了,没说为什么。现在 _report_evidence 把 fault +
#      对亲本相对变化最大的指标(精度 1.0->0.03 排在耗时 121->51 前)+ 短
#      字符串翻转(warm_start full->parent-partial)压进条目。指标保持不透明
#      键值对,不破分层。
#
#   2. **趋同聚类(缺口四)。** 四次独立 RADIX_BITS 死亡是一个模式四具尸体,
#      不是四行无关记录;而 top_n=2 只露两具、还把其他失败模式挤出窗口。
#      loss_clusters 按 (文件, 首个新增标识符) 聚类,渲染
#      "tried 4 times INDEPENDENTLY, helped 0 times" + 最惨实例的证据。
#      已翻案条目离开聚类(垫脚石保护不变)。
#
#   3. **全栈经验上线(recipe e3r -> e5s)。** IMO 入口早就跑着完整三层
#      (L0 台账 + L1 反思归因 + L2 scratchpad + lesson 指令注入),而
#      recipes 线上的域只拿到纯机械台账 —— e5s 把那套接线平移进注册表。
#      e4a(retrieval+rejected)同时入册,作为消融基线保留。r12 第 1 代
#      16 个提案里 8 个在重买两条已付过学费的教训。
#
#   另:experience.jsonl 随 promotion/ 一起跨轮搬运(缺口二,launch 脚本一行)。
#   r12 的 16 行验尸记录(含 evidence 为空的旧 schema 行,向后兼容)是 r14
#   第 0 代提案就能读到的负面经验。
#
#   未修(进 backlog):代内并发盲区 —— 16 个提案 42 秒内并发发出,同代兄弟
#   互相看不见对方的死亡;需要分段出题或代内配额,都要用延迟换信息。
#
# 基线实测(2026-07-29 官方 1100 题、空卡、Δ 适应权重、两遍 + 分桶):
#   tiers 0-9 共 195.1 秒(预算 300)—— tier 0 121.2->24.8,tier 9
#   234.9->125.2;tier 10 单层 880.5 秒,需 ~8x。
#   精度是开放伤口:适应把 loss 从 6.4e-10 抬到 4.0e-5,tier 8 75%、
#   tier 9 20%。种子缓存 train_seconds 置 0,让档位训练在跑内继续压
#   loss;DELTA_SHARE 0.5->0.85(推理只活在填充带里)。
#   官方口径当前值:h90=7(时间充裕但精度掉)——愈合后目标 h90=9,
#   tier 10 的 8 倍是搜索的主攻方向。
