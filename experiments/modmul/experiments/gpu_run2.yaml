# Run 2(L40S):五改齐上 —— 加权 fitness(v1)/双种子双岛/repair 节流/
# rewrite 提权/n=50 评测集。e1 与 e0 同配置对照(仅差 C1 反馈注入)。
search:
  num_generations: 20
  eval_batch_size: 3
  llm_models: ["qwen3-coder-plus"]
  llm_max_tokens: 8192
  seed: 13
  operator_probs: [0.45, 0.45, 0.1]   # rewrite 0.3->0.45(gpu_run1 仅轮到 6 次)
  repair_probability: 0.4             # 修复风暴节流(gpu_run1: 36/60 是 repair)
population:
  num_islands: 2                      # 岛0=serial_ar,岛1=horner_cell
