# Round-1 主跑（L40S 46GB，2-3 天连续）。
# 与 run2 的差异：多文件 workspace 基因组 / H90 同构 fitness / ASHA 三级晋级 /
# 三岛异构种子 + 岛间迁移 / 代数放到 120。
#
# 机时估算：R0 淘汰 ~9 min，R2 走满 ~95 min；批 3 并发下每代 10-100 min，
# 120 代按经验落在 40-70 小时。跑不完不要紧 —— checkpoint 每代落盘，
# 同一 run-dir 重跑即续跑；预算/时间到了就停在当代。
search:
  num_generations: 120
  eval_batch_size: 3                  # 3 个候选并发；每个的训练/推理都在子进程里
  llm_models: ["qwen3-coder-plus"]
  llm_max_tokens: 16384               # 多文件基因组，整文件重写需要更多 token
  seed: 21
  operator_probs: [0.45, 0.45, 0.1]   # revise / rewrite / recombine
  repair_probability: 0.4             # 防修复风暴（run1: 36/60 提案是 repair）
  max_consecutive_infra_failures: 5
population:
  num_islands: 3                      # 0=limb_horner 1=horner_cell 2=serial_ar
  migration_interval: 10              # 开岛间迁移：run1 里岛 0 靠结构变异破平台，
  migration_rate: 0.1                 # 让好结构有机会跨岛传播
  archive_size: 60
